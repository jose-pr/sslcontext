[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "sslcontext"
version = "2.1.0"
authors = [{ name = "Jose A." }]
description = "Client certificates from OS keystores (Windows CNG, macOS Keychain, PKCS#11 smart cards) in a standard ssl.SSLContext, chosen as the browser would"
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
license-files = ["LICENSE"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Programming Language :: Python :: 3",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS",
    "Topic :: Security :: Cryptography",
    "Typing :: Typed",
]
# system_context(): the operating system verifies servers (truststore needs 3.10;
# 3.9 verifies through OpenSSL over the default store).
dependencies = ['truststore>=0.10,<0.11; python_version >= "3.10"']

[project.optional-dependencies]
# The sslcontext command; only sslcontext.cli imports duho.
cli = ["duho>=0.7.8,<0.8"]
dev = ["black", "build", "pytest", "sslcontext[cli]"]
docs = ["mkdocs", "mkdocs-material", "mkdocstrings[python]"]

[project.scripts]
sslcontext = "sslcontext.cli:main"

[project.urls]
Homepage = "https://github.com/jose-pr/sslcontext/"
Documentation = "https://jose-pr.github.io/sslcontext/"
Issues = "https://github.com/jose-pr/sslcontext/issues"

# Personal overrides, agent config and the contributor AGENTS.md never ship;
# src/sslcontext/AGENTS.md (the API header) does.
[tool.hatch.build.targets.sdist]
exclude = ["/.*", "/AGENTS.md", "/benchmarks", "*.local.*", "CLAUDE*"]

[tool.hatch.build.targets.wheel]
packages = ["src/sslcontext"]
exclude = ["*.local.*", "CLAUDE*"]

[tool.black]
target-version = ["py39"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
filterwarnings = ["error"]
markers = [
    "integration: talks to a real OS keystore and changes it for the duration of the test",
]
